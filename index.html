<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Hamster Gold • 1 Сезон</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif;user-select:none}
body{background:radial-gradient(circle at top,#291d0e 0%,#0d0a07 75%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 76px;overflow-x:hidden}
.top-bar{width:100%;max-width:360px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{background:rgba(255,255,255,0.07);border:1px solid rgba(251,191,36,0.35);padding:4px 10px;border-radius:16px;font-size:11px;font-weight:bold;color:#fde68a;cursor:pointer}
.prof-card{width:100%;max-width:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.p-box{background:rgba(24,20,15,0.85);border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:7px;text-align:center}
.p-box span{font-size:9px;color:#a8a29e;display:block}.p-box b{font-size:13px;color:#fde047}
.bal-row{display:flex;align-items:center;gap:8px;font-size:32px;font-weight:900;color:#fff;margin-bottom:4px;text-shadow:0 2px 15px rgba(245,158,11,0.5)}
.league-bar{width:100%;max-width:280px;margin-bottom:16px;text-align:center}
.l-info{display:flex;justify-content:space-between;font-size:11px;color:#fcd34d;margin-bottom:4px;font-weight:bold}
.l-track{height:7px;background:#1c1917;border-radius:10px;overflow:hidden;border:1px solid #44403c}
.l-fill{height:100%;width:10%;background:linear-gradient(90deg,#f59e0b,#fde047);transition:width 0.3s}
.coin-wrap{position:relative;width:210px;height:210px;margin:6px 0 18px;display:flex;align-items:center;justify-content:center}
.coin{width:196px;height:196px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fef08a 0%,#f59e0b 45%,#92400e 95%);border:6px solid #fde047;box-shadow:0 0 35px rgba(245,158,11,0.45),inset 0 4px 12px rgba(255,255,255,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.08s;touch-action:manipulation}
.coin:active{transform:scale(0.93)}.coin span{font-size:74px;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.5))}
.energy-row{width:100%;max-width:320px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold;color:#fde047;margin-bottom:8px}
.tab{display:none;width:100%;max-width:360px;flex-direction:column;align-items:center}.tab.active{display:flex}
.grid-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.card{background:rgba(24,20,15,0.88);border:1px solid rgba(251,191,36,0.28);border-radius:13px;padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.card-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}.card-ico{font-size:26px}
.card-btn{width:100%;background:linear-gradient(135deg,#f59e0b,#b45309);border:none;color:#fff;padding:6px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer}
.card-btn:disabled{background:#292524;color:#78716c}
.box{width:100%;background:rgba(24,20,15,0.85);border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:linear-gradient(135deg,#10b981,#047857);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer}
.inp{flex:1;background:rgba(0,0,0,0.5);border:1px solid #57534e;border-radius:8px;padding:7px 10px;color:#fff;font-size:12px;outline:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:#100d09;border-top:1px solid #78350f;display:flex;padding:6px 4px;z-index:50}
.nav-btn{flex:1;background:none;border:none;color:#78716c;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:2px;cursor:pointer;font-weight:bold}
.nav-btn span{font-size:16px}.nav-btn.active{color:#fbbf24}
@keyframes popUp{0%{opacity:1;transform:translate(-50%,0) scale(0.9)}100%{opacity:0;transform:translate(-50%,-75px) scale(1.25)}}
.tap-num{position:fixed;font-size:22px;font-weight:900;color:#fde047;pointer-events:none;z-index:150;text-shadow:0 2px 8px #000;animation:popUp 0.75s ease-out forwards}
.toast{position:fixed;top:14px;background:#10b981;color:#fff;padding:7px 14px;border-radius:18px;font-size:12px;font-weight:bold;opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:200}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="splash" style="position:fixed;inset:0;background:radial-gradient(circle at top,#291d0e,#090705);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center">
  <div style="font-size:68px;margin-bottom:8px">🐹</div>
  <div style="padding:4px 14px;background:rgba(245,158,11,0.2);border:1px solid #f59e0b;border-radius:20px;font-size:11px;font-weight:bold;color:#fde047;margin-bottom:8px">🏆 1-Й СЕЗОН • @maksyuga</div>
  <h1 style="font-size:26px;color:#fde047;margin-bottom:10px">HAMSTER GOLD</h1>
  <p style="font-size:13px;color:#d6d3d1;max-width:290px;margin-bottom:20px">Тапай хомяка, качай карточки прибыли в час и забирай призы в чате!</p>
  <button class="btn" style="background:linear-gradient(135deg,#f59e0b,#b45309);padding:14px 36px;font-size:16px;border-radius:14px" onclick="document.getElementById('splash').remove()">🚀 ИГРАТЬ</button>
</div>
<div class="top-bar"><div class="pill" id="uName" onclick="setNick()">✏️ Гость</div><div class="pill" onclick="openTop()">🏆 Топ чата</div></div>
<div class="prof-card">
  <div class="p-box"><span>За тап</span><b id="tapVal">+1 ❇️</b></div>
  <div class="p-box"><span>Лига</span><b id="leagueName">Бронза</b></div>
  <div class="p-box"><span>Прибыль в час</span><b id="pphVal">+0 ❇️</b></div>
</div>
<div class="tab active" id="t-tap">
  <div class="bal-row">❇️ <span id="bal">0</span></div>
  <div class="league-bar"><div class="l-info"><span id="lCur">Бронза</span><span id="lNext">Цель: 500</span></div><div class="l-track"><div class="l-fill" id="lFill"></div></div></div>
  <div class="coin-wrap"><div class="coin" id="hamsterBtn"><span>🐹</span></div></div>
  <div class="energy-row"><span>⚡ <span id="enCur">500</span> / <span id="enMax">500</span></span><button class="pill" onclick="boostEnergy()">🔋 Полная энергия (4ч)</button></div>
  <div class="box" style="max-width:320px;margin-top:6px"><input class="inp" id="cipherIn" placeholder="Секретный шифр дня"><button class="btn" onclick="checkCipher()">ОК</button></div>
</div>
<div class="tab" id="t-mine"><h3 style="color:#fde047;font-size:15px;margin-bottom:10px">📈 Прокачка Биржи (Пассивный доход)</h3><div class="grid-cards" id="cardsGrid"></div></div>
<div class="tab" id="t-shop"><h3 style="color:#fde047;font-size:15px;margin-bottom:10px">🏆 Магазин призов для чата</h3><div id="shopGrid" style="width:100%"></div></div>
<div class="nav">
  <button class="nav-btn active" onclick="goTab('tap',this)"><span>🐹</span>Биржа</button>
  <button class="nav-btn" onclick="goTab('mine',this)"><span>⛏</span>Карточки</button>
  <button class="nav-btn" onclick="goTab('shop',this)"><span>🎁</span>Призы</button>
</div>
<script>
const ST_K = 'hg_save_v1';
let st = JSON.parse(localStorage.getItem(ST_K) || 'null') || {
  bal: 0, tap: 1, pph: 0, en: 500, maxEn: 500, last: Date.now(), enBoost: 0, nick: '',
  cards: {}, codes: []
};

const CARDS = [
  { ico: '⛏', name: 'Золотая кирка', base: 25, pph: 15 },
  { ico: '💎', name: 'Шахта изумрудов', base: 80, pph: 55 },
  { ico: '🤖', name: 'Авто-бот чата', base: 200, pph: 150 },
  { ico: '🏦', name: 'Крипто-банк', base: 500, pph: 400 },
  { ico: '🖤', name: 'Чёрный рынок', base: 1200, pph: 1050 },
  { ico: '👑', name: 'Трон @maksyuga', base: 3000, pph: 2800 }
];

const PRIZES = [
  { n: 'Снятие лимитов в чате (12ч)', p: 150 },
  { n: 'Закреп поста в чате (24ч)', p: 300 },
  { n: 'Вечный Префикс в чате', p: 600 },
  { n: 'Модератор чата (5 дней)', p: 1500 },
  { n: '25 Звёзд Telegram ⭐️', p: 2500 },
  { n: '100 Звёзд Telegram ⭐️', p: 6000 },
  { n: 'Telegram Gift / NFT 🎁', p: 12000 },
  { n: '👑 АДМИНКА НАВСЕГДА', p: 25000 }
];

function save() { st.last = Date.now(); localStorage.setItem(ST_K, JSON.stringify(st)); }
function toast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function goTab(id, el) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  document.getElementById('t-' + id).classList.add('active'); el.classList.add('active');
}

function getLeague(b) {
  if (b >= 20000) return { n: '👑 Легенда', next: 50000, min: 20000 };
  if (b >= 5000) return { n: '💎 Алмаз', next: 20000, min: 5000 };
  if (b >= 1500) return { n: '🟡 Золото', next: 5000, min: 1500 };
  if (b >= 500) return { n: '⚪ Серебро', next: 1500, min: 500 };
  return { n: '🟤 Бронза', next: 500, min: 0 };
}

function renderUI() {
  document.getElementById('bal').innerText = Math.floor(st.bal).toLocaleString('ru-RU');
  document.getElementById('tapVal').innerText = `+${st.tap} ❇️`;
  document.getElementById('pphVal').innerText = `+${st.pph} ❇️`;
  document.getElementById('enCur').innerText = Math.floor(st.en);
  document.getElementById('enMax').innerText = st.maxEn;

  const lg = getLeague(st.bal);
  document.getElementById('leagueName').innerText = lg.n;
  document.getElementById('lCur').innerText = lg.n;
  document.getElementById('lNext').innerText = `Цель: ${lg.next.toLocaleString('ru-RU')}`;
  const pct = Math.min(100, Math.max(5, ((st.bal - lg.min) / (lg.next - lg.min)) * 100));
  document.getElementById('lFill').style.width = pct + '%';

  document.getElementById('cardsGrid').innerHTML = CARDS.map((c, i) => {
    const lvl = st.cards[i] || 0;
    const cost = Math.floor(c.base * Math.pow(1.45, lvl));
    return `<div class="card"><div class="card-top"><span class="card-ico">${c.ico}</span><div><b style="font-size:12px">${c.name}</b><div style="font-size:10px;color:#6ee7b7">+${c.pph} ❇️/ч • Ур.${lvl}</div></div></div><button class="card-btn" ${st.bal < cost ? 'disabled' : ''} onclick="buyCard(${i})">Улучшить (${cost} ❇️)</button></div>`;
  }).join('');
}

document.getElementById('hamsterBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (st.en < st.tap) { toast('⚡ Мало энергии!'); return; }
  st.en -= st.tap;
  st.bal += st.tap;
  try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch (err) {}
  const num = document.createElement('div');
  num.className = 'tap-num';
  num.innerText = `+${st.tap}`;
  num.style.left = (e.clientX || window.innerWidth / 2) + 'px';
  num.style.top = (e.clientY || 260) + 'px';
  document.body.appendChild(num);
  setTimeout(() => num.remove(), 750);
  renderUI(); save();
});

function buyCard(i) {
  const c = CARDS[i], lvl = st.cards[i] || 0;
  const cost = Math.floor(c.base * Math.pow(1.45, lvl));
  if (st.bal < cost) return;
  st.bal -= cost; st.cards[i] = lvl + 1; st.pph += c.pph; st.tap += 1; st.maxEn += 50;
  toast(`📈 ${c.name} -> Ур.${lvl + 1}!`);
  renderUI(); save();
}

function boostEnergy() {
  if (Date.now() - st.enBoost < 14400000) { toast('⏳ Доступно раз в 4 часа!'); return; }
  st.enBoost = Date.now(); st.en = st.maxEn;
  toast('⚡ Энергия восстановлена!'); renderUI(); save();
}

function checkCipher() {
  const v = document.getElementById('cipherIn').value.trim().toUpperCase();
  if (v === 'GOLD2026' && !st.codes.includes(v)) {
    st.codes.push(v); st.bal += 250; toast('🎁 Шифр принят: +250 ❇️!'); renderUI(); save();
  } else toast('❌ Неверный или использованный шифр');
}

document.getElementById('shopGrid').innerHTML = PRIZES.map(x => `<div class="box"><b style="font-size:12px">${x.n}</b><button class="btn" onclick="buyPrize('${x.n}',${x.p})">${x.p} ❇️</button></div>`).join('');
function buyPrize(n, p) {
  if (st.bal < p) { toast(`❌ Нужно ${p} ❇️`); return; }
  st.bal -= p; renderUI(); save();
  alert(`🎫 ЧЕК НАГРАДЫ: ${n} (${p} ❇️). Сделай скриншот и отправь @maksyuga!`);
}

function setNick() {
  const v = prompt('Введи свой @username:', st.nick);
  if (v && v.trim()) { st.nick = v.trim(); document.getElementById('uName').innerText = '✏️ ' + st.nick; save(); }
}

async function openTop() {
  const LB = 'https://npoint.io';
  const u = window.Telegram?.WebApp?.initDataUnsafe?.user;
  const uid = u?.id ? String(u.id) : 'me';
  const name = st.nick || (u?.username ? '@' + u.username : 'Игрок');
  let b = {};
  try { const r = await fetch(LB, { cache: 'no-store' }); const j = await r.json(); if (j?.players) b = j.players; } catch (e) {}
  b[uid] = { name, bal: Math.floor(st.bal), rank: getLeague(st.bal).n };
  try { await fetch(LB, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ players: b }) }); } catch (e) {}
  const list = Object.values(b).sort((a, b) => b.bal - a.bal).slice(0, 10).map((p, i) => `#${i + 1} ${p.name} — ${p.bal} ❇️`).join('\n');
  alert('🏆 ТОП ЧАТА (HAMSTER GOLD):\n\n' + list);
}

(function boot() {
  const u = window.Telegram?.WebApp?.initDataUnsafe?.user;
  if (window.Telegram?.WebApp) window.Telegram.WebApp.expand();
  if (!st.nick && u) st.nick = u.username ? '@' + u.username : u.first_name;
  if (st.nick) document.getElementById('uName').innerText = '✏️ ' + st.nick;

  const secOff = Math.min(10800, Math.floor((Date.now() - (st.last || Date.now())) / 1000));
  if (secOff > 10 && st.pph > 0) {
    const earned = Math.floor((st.pph / 3600) * secOff);
    if (earned > 0) { st.bal += earned; toast(`💰 Пока тебя не было: +${earned} ❇️!`); }
  }
  st.en = Math.min(st.maxEn, st.en + secOff * 2);
  renderUI();

  setInterval(() => {
    if (st.en < st.maxEn) st.en = Math.min(st.maxEn, st.en + 2);
    if (st.pph > 0) st.bal += st.pph / 3600;
    renderUI();
  }, 1000);
})();
</script>
</body>
</html>
