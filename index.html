<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Минное Поле 2.0</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif;user-select:none}
body{background:radial-gradient(circle at top,#0d1f2d,#050a0f);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.header{text-align:center;margin-bottom:12px}
.header h1{font-size:24px;letter-spacing:1.5px;text-transform:uppercase;color:#00ffcc;text-shadow:0 0 12px rgba(0,255,204,0.6)}
.player-badge{display:inline-block;margin-top:6px;padding:4px 12px;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);border-radius:20px;font-size:13px;color:#7dd3fc;font-weight:600}
.stats{display:flex;gap:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(0,255,204,0.3);padding:10px 20px;border-radius:12px;margin-bottom:16px;font-size:16px;font-weight:bold}
.stat-crystals{color:#2ecc71}
.stat-tries{color:#38bdf8}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:340px;background:rgba(13,31,45,0.8);padding:12px;border-radius:16px;border:2px solid #1e3a5f;box-shadow:0 0 25px rgba(0,200,255,0.15)}
.cell{aspect-ratio:1;background:linear-gradient(145deg,#13293d,#0b1926);border:2px solid #234b6e;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#7dd3fc;cursor:pointer;transition:transform 0.15s;position:relative}
.cell:active{transform:scale(0.94)}
.cell.locked{cursor:not-allowed;opacity:0.75}
.cell.open-crystal{background:linear-gradient(145deg,#063b27,#042417);border-color:#2ecc71;box-shadow:0 0 15px rgba(46,204,113,0.5);color:#fff;cursor:default;opacity:1}
.cell.open-jackpot{background:linear-gradient(145deg,#3b2d06,#241b04);border-color:#f1c40f;box-shadow:0 0 18px rgba(241,196,15,0.7);color:#fff;cursor:default;opacity:1}
.cell.open-bomb{background:linear-gradient(145deg,#450a0a,#260404);border-color:#ef4444;box-shadow:0 0 18px rgba(239,68,68,0.7);animation:shake 0.35s;cursor:default;opacity:1}
.cell-num{position:absolute;top:4px;left:6px;font-size:11px;color:rgba(255,255,255,0.5)}
.cell-val{font-size:14px;margin-top:2px;font-weight:800}
.result-box{margin-top:16px;text-align:center;min-height:85px;max-width:340px}
.result-text{font-size:15px;line-height:1.4;color:#e2e8f0;margin-bottom:10px}
.timer-box{display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.5);color:#fca5a5;padding:10px 18px;border-radius:10px;font-size:15px;font-weight:bold;margin-top:6px}
.timer-box span{color:#fff;font-family:monospace;font-size:17px}
.meta{margin-top:14px;font-size:11px;color:#64748b}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<div class="header">
  <h1>💣 Минное Поле ❇️</h1>
  <div class="player-badge" id="playerName">Игрок: Гость</div>
</div>
<div class="stats">
  <div class="stat-crystals">Лут: <span id="score">0</span> ❇️</div>
  <div class="stat-tries">Попыток: <span id="tries">3</span></div>
</div>
<div class="grid" id="grid"></div>
<div class="result-box">
  <div class="result-text" id="status">Выбери любые 3 клетки!</div>
  <div class="timer-box" id="timerBox">Новая карточка через: <span id="countdown">24:00:00</span></div>
</div>
<div class="meta" id="roundMeta"></div>
<script>
const CD=86400000,KEY='mine_v2';
if(window.Telegram&&window.Telegram.WebApp){
  window.Telegram.WebApp.expand();
  const u=window.Telegram.WebApp.initDataUnsafe?.user;
  if(u)document.getElementById('playerName').innerText='Игрок: '+(u.username?'@'+u.username:u.first_name);
}
let board=[],opened=[],tries=3,score=0,over=false,tint=null;
function start(){
  tries=3;score=0;opened=[];over=false;
  document.getElementById('score').innerText=0;
  document.getElementById('tries').innerText=3;
  document.getElementById('status').innerText='Выбери любые 3 клетки!';
  document.getElementById('timerBox').style.display='none';
  const items=[
    {t:'b',i:'💣',v:0,l:'БУМ!'},{t:'b',i:'💣',v:0,l:'БУМ!'},{t:'b',i:'💣',v:0,l:'БУМ!'},{t:'b',i:'💣',v:0,l:'БУМ!'},
    {t:'j',i:'💎',v:5,l:'+5'},{t:'c',i:'❇️',v:2,l:'+2'},{t:'c',i:'❇️',v:2,l:'+2'},{t:'c',i:'❇️',v:2,l:'+2'},
    {t:'c',i:'❇️',v:1,l:'+1'},{t:'c',i:'❇️',v:1,l:'+1'},{t:'c',i:'❇️',v:1,l:'+1'},{t:'c',i:'❇️',v:1,l:'+1'},
    {t:'c',i:'❇️',v:1,l:'+1'},{t:'c',i:'❇️',v:1,l:'+1'},{t:'c',i:'❇️',v:1,l:'+1'},{t:'c',i:'❇️',v:1,l:'+1'}
  ];
  board=items.sort(()=>Math.random()-0.5);
  const d=new Date(),c=Math.floor(1000+Math.random()*9000);
  const m=`Код: #${c} | ${d.toLocaleDateString()} ${d.toLocaleTimeString().slice(0,5)}`;
  document.getElementById('roundMeta').innerText=m;
  save(null,m);render();
}
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  board.forEach((it,idx)=>{
    const el=document.createElement('div');el.className='cell';
    if(opened.includes(idx)){
      el.classList.add('opened',it.t==='b'?'open-bomb':(it.t==='j'?'open-jackpot':'open-crystal'));
      el.innerHTML=`<span class="cell-num">${idx+1}</span><span>${it.i}</span><span class="cell-val">${it.l}</span>`;
    }else{
      el.innerText=idx+1;
      if(over)el.classList.add('locked');
      el.onclick=()=>openC(idx);
    }
    g.appendChild(el);
  });
}
function openC(idx){
  if(over||opened.includes(idx))return;
  opened.push(idx);
  const it=board[idx];tries--;
  if(it.t!=='b')score+=it.v;
  document.getElementById('tries').innerText=tries;
  document.getElementById('score').innerText=score;
  let fin=null;
  if(tries===0){over=true;fin=Date.now();finishUI(fin);}
  const m=document.getElementById('roundMeta').innerText;
  save(fin,m);render();
}
function finishUI(fin){
  document.getElementById('status').innerHTML=`Раунд окончен! Твой лут: <b>+${score} ❇️</b>.<br>Сделай скриншот и кинь админу в чат!`;
  document.getElementById('timerBox').style.display='block';
  if(tint)clearInterval(tint);
  const tick=()=>{
    const diff=(fin+CD)-Date.now();
    if(diff<=0){clearInterval(tint);localStorage.removeItem(KEY);start();return;}
    const h=Math.floor(diff/3600000),mn=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    document.getElementById('countdown').innerText=`${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  tick();tint=setInterval(tick,1000);
}
function save(fin,m){localStorage.setItem(KEY,JSON.stringify({board,opened,tries,score,over,fin,m}));}
function load(){
  const raw=localStorage.getItem(KEY);if(!raw)return start();
  try{
    const st=JSON.parse(raw);
    if(st.over&&st.fin){
      if(Date.now()-st.fin>=CD){localStorage.removeItem(KEY);return start();}
      board=st.board;opened=st.opened;tries=0;score=st.score;over=true;
      document.getElementById('score').innerText=score;document.getElementById('tries').innerText=0;
      document.getElementById('roundMeta').innerText=st.m||'';render();finishUI(st.fin);
    }else{
      board=st.board;opened=st.opened;tries=st.tries;score=st.score;over=false;
      document.getElementById('score').innerText=score;document.getElementById('tries').innerText=tries;
      document.getElementById('roundMeta').innerText=st.m||'';render();
    }
  }catch(e){start();}
}
load();
</script>
</body>
</html>
